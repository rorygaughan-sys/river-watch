<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>River Watch</title>
  <style>
    body { max-width: 75rem; margin: 2rem auto; padding: 0 1rem;
           font-family: system-ui, sans-serif; line-height: 1.5; }
    button { padding: .55rem .85rem; font: inherit; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; padding: .65rem;
             border-bottom: 1px solid #ccc; }
    td, pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>River Watch</h1>
  <p>AI can make mistakes. A person makes the final decision.</p>

  <h2>Tonight’s plan</h2>
  <button id="plan-button">What is tonight’s plan?</button>
  <p id="plan-status" role="status"></p>
  <div class="table-wrap">
    <table id="plan-table" hidden>
      <thead>
        <tr>
          <th scope="col">Town</th>
          <th scope="col">Draft level</th>
          <th scope="col">Working</th>
          <th scope="col">Proposed action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>Team Sheet</h2>
  <button id="sheet-button">Read Team Sheet</button>
  <pre id="sheet-result" aria-live="polite"></pre>

  <h2>Clonmel forecast</h2>
  <button id="clonmel-button">Read Clonmel forecast</button>
  <pre id="clonmel-result" aria-live="polite"></pre>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzRzb8gYXBbq8OC8dYXUUM_dhR0NmwN9A1Jyfoefp24GNND6yioToO1-lpU9Lj0_IGtmp2rD-e8m5u/pub?gid=1043010851&single=true&output=csv";

    // Forecast request coordinates and stored OPW history for 2016–2025.
    // Columns: town, latitude, longitude, OPW station, P95, P99, readings.
    const towns = [
      ["Clonmel", 52.351525, -7.694598, "16011", 150.17, 195.77, 3522],
      ["Fermoy", 52.138568, -8.276634, "18107", 153.50, 254.67, 3579],
      ["Mallow", 52.132340, -8.641608, "18003", 107.88, 175.47, 3406],
      ["Bandon", 51.746954, -8.731538, "20001", 42.49, 83.45, 784],
      ["Enniscorthy", 52.502307, -6.566852, "12001", 65.09, 100.31, 3614],
      ["Ennis", 52.846674, -8.981789, "27002", 32.09, 41.71, 3641],
      ["Athlone", 53.421534, -7.940756, "26027", 243.21, 307.93, 3516],
      ["Carrick-on-Shannon", 53.943210, -8.095559, "26085", 96.13, 116.09, 987]
    ];

    const levels = ["Normal", "Standby", "Barriers"];
    const standby = "Confirm staff on call, check pumps and stage sandbags.";

    async function read(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`Request failed (${response.status}).`);
      return response;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";

      for (const [token] of text.replace(/^\uFEFF/, "").matchAll(
        /"(?:[^"]|"")*"|[^",\r\n]+|,|\r\n|\r|\n/g
      )) {
        if (token === ",") {
          row.push(field);
          field = "";
        } else if (/^[\r\n]/.test(token)) {
          rows.push([...row, field]);
          row = [];
          field = "";
        } else {
          field += token.startsWith('"')
            ? token.slice(1, -1).replaceAll('""', '"')
            : token;
        }
      }

      if (row.length || field) rows.push([...row, field]);
      return rows;
    }

    async function readTeam() {
      const csv = await (await read(sheetUrl)).text();
      const [headers, ...rows] = parseCsv(csv);
      const required = ["town", "county", "barrier_sets", "flow_override_m3s",
                        "warning_override", "notes"];
      if (!required.every(header => headers?.includes(header))) {
        throw new Error("Required Team Sheet columns are missing.");
      }

      return new Map(rows.map(cells => {
        const row = Object.fromEntries(
          headers.map((header, index) => [header, cells[index] ?? ""])
        );
        return [row.town.trim(), row];
      }));
    }

    async function readForecast(town) {
      const [, latitude, longitude] = town;
      const url = new URL("https://flood-api.open-meteo.com/v1/flood");
      url.search = new URLSearchParams({
        latitude, longitude, daily: "river_discharge",
        forecast_days: "3", timezone: "GMT"
      });

      const forecast = await (await read(url)).json();
      const { time: dates, river_discharge: flows } = forecast.daily ?? {};
      if (dates?.length !== 3 || flows?.length !== 3 ||
          !flows.every(flow => Number.isFinite(flow) && flow >= 0)) {
        throw new Error("A complete three-day forecast is unavailable.");
      }

      const peak = Math.max(...flows);
      return {
        peak,
        date: dates[flows.indexOf(peak)],
        point: `${forecast.latitude}, ${forecast.longitude}`,
        daily: dates.map((date, index) => `${date}: ${flows[index]} m³/s`)
      };
    }

    const warningUrl = "https://www.met.ie/Open_Data/json/warning_IRELAND.json";
    const countyCodes = {
      tipperary: "EI26", cork: "EI04", wexford: "EI30", clare: "EI03",
      westmeath: "EI29", leitrim: "EI14", roscommon: "EI24"
    };

    async function readWarnings() {
      const warnings = await (await read(warningUrl)).json();
      if (!Array.isArray(warnings)) throw new Error("Unexpected warnings feed format.");
      return { warnings, checkedAt: new Date() };
    }

    function matchingRainWarnings(row, feed) {
      const counties = [row.county.trim().toLowerCase()];
      if (/roscommon/i.test(row.notes)) counties.push("roscommon");
      const areas = counties.flatMap(county => [county, countyCodes[county]?.toLowerCase()]);
      const start = feed.checkedAt.getTime();
      const end = start + 48 * 60 * 60 * 1000;
      return feed.warnings.filter(warning =>
        /^(rain|rainfall)$/i.test(warning.type) &&
        /^(yellow|orange|red)$/i.test(warning.level) &&
        /^(warning)?$/i.test(warning.status ?? "") &&
        Array.isArray(warning.regions) &&
        warning.regions.some(region => areas.includes(String(region).trim().toLowerCase())) &&
        Date.parse(warning.onset) <= end && Date.parse(warning.expiry) > start
      );
    }

    function calculate(town, row, forecast, warningFeed) {
      const [name, , , gauge, p95, p99, readings] = town;
      const working = [
        `OPW gauge ${gauge}, 2016–2025: P95 ${p95}, P99 ${p99} m³/s`,
        `History coverage: ${readings.toLocaleString("en-IE")} of 3,653 days`
      ];
      if (name === "Bandon" || name === "Carrick-on-Shannon") {
        working.push("Several years are missing. Thresholds are provisional.");
      }
      if (forecast) {
        working.push(
          ...forecast.daily,
          `Open-Meteo / Copernicus GloFAS peak: ${forecast.peak} m³/s on ${forecast.date} (GMT)`,
          `Model point: ${forecast.point}. River match pending.`
        );
      } else {
        working.push("Live forecast unavailable.");
      }
      if (!row) return { name, working: [...working, "Team Sheet row unavailable."] };

      working.push(`Google Team Sheet note: ${row.notes || "None recorded"}`);
      const entered = row.flow_override_m3s.trim();
      const flow = entered ? Number(entered) : forecast?.peak;
      const warning = row.warning_override.trim().toLowerCase();
      const rehearsalWarning = warning === "orange" || warning === "red";
      const liveWarnings = warningFeed ? matchingRainWarnings(row, warningFeed) : [];
      const liveRaise = liveWarnings.some(item => /^(orange|red)$/i.test(item.level));
      const raised = rehearsalWarning || liveRaise;

      if (warningFeed) {
        working.push(`Met Éireann checked at ${warningFeed.checkedAt.toISOString()}.`);
        if (!liveWarnings.length) working.push("No matching rain warnings in the next 48 hours.");
        for (const item of liveWarnings) {
          working.push(`Met Éireann: ${item.level} rain warning, ${item.onset} to ${item.expiry} (${item.regions.join(", ")}).`);
        }
      } else {
        working.push("Met Éireann feed unavailable. Live warning adjustment is unknown.");
      }

      if (rehearsalWarning) working.push(`Google Team Sheet rehearsal warning: ${warning}.`);
      if (!Number.isFinite(flow) || flow < 0) {
        working.push(entered ? "Invalid Sheet flow override." : "No usable flow value.");
        return { name, working };
      }

      const base = flow >= p99 ? 2 : flow >= p95 ? 1 : 0;
      const level = Math.min(2, base + Number(raised));
      const reason = ["below P95", "at or above P95 and below P99", "at or above P99"][base];

      working.push(
        `Flow used: ${flow} m³/s (${entered ? "rehearsal override from Google Team Sheet" : "forecast peak"})`,
        `Base level: ${levels[base]}. The flow is ${reason}.`,
        raised
          ? `${rehearsalWarning ? "Rehearsal" : "Live"} warning rule: ${levels[base]} → ${levels[level]}.`
          : "No warning uplift applied."
      );

      const availableSets = Number(row.barrier_sets);
      const hasBarrierSet = availableSets > 0 && !/barrier set.*on loan/i.test(row.notes);
      if (level === 2) {
        working.push(`Barrier sets recorded in Google Team Sheet: ${row.barrier_sets || "unknown"}.`);
      }

      return { name, row, flow, p99, level, hasBarrierSet, working };
    }

    function assignCrews(results, team) {
      const mallow = team.get("Mallow");
      const mallowRestricted = !mallow || /mallow only|van in repair/i.test(mallow.notes);
      const areas = {
        Clonmel: ["Clonmel", "Fermoy", "Enniscorthy"],
        Mallow: mallowRestricted ? ["Mallow"] : ["Mallow", "Fermoy", "Bandon"],
        Athlone: ["Athlone", "Carrick-on-Shannon", "Ennis"]
      };
      const jobs = { Clonmel: [], Mallow: [], Athlone: [] };
      const assignments = new Map();
      const candidates = results.filter(result => result.level === 2 && result.hasBarrierSet);
      candidates.sort((a, b) => (b.flow / b.p99 - a.flow / a.p99) || b.flow - a.flow);

      function assign(town, visited) {
        for (const [crew, area] of Object.entries(areas)) {
          if (!area.includes(town) || visited.has(crew)) continue;
          visited.add(crew);
          const crewJobs = jobs[crew];

          if (crewJobs.length < 2) {
            crewJobs.push(town);
            assignments.set(town, crew);
            return true;
          }

          for (const [index, earlierTown] of crewJobs.entries()) {
            if (assign(earlierTown, visited)) {
              crewJobs[index] = town;
              assignments.set(town, crew);
              return true;
            }
          }
        }
        return false;
      }

      for (const candidate of candidates) assign(candidate.name, new Set());
      return { assignments, jobs, mallowRestricted };
    }

    function proposedAction(result, assignments) {
      if (result.level === undefined) return "Check the missing inputs.";
      if (result.level === 0) return "Continue routine monitoring.";
      if (result.level === 1) return standby;

      const crew = assignments.get(result.name);
      if (crew) return `${crew} crew to erect barriers before 18:00.`;

      const reason = result.hasBarrierSet
        ? "No eligible crew is available."
        : "No barrier set is available.";
      return `${reason} ${standby} Flag to the Area Manager.`;
    }

    document.querySelector("#sheet-button").addEventListener("click", async () => {
      const result = document.querySelector("#sheet-result");
      result.textContent = "Reading the Team Sheet…";
      try {
        result.textContent = await (await read(sheetUrl)).text();
      } catch {
        result.textContent = "Couldn’t read the Team Sheet.";
      }
    });

    document.querySelector("#clonmel-button").addEventListener("click", async () => {
      const output = document.querySelector("#clonmel-result");
      output.textContent = "Reading the Team Sheet and Clonmel forecast…";

      try {
        const [team, forecast, warningFeed] = await Promise.all([
          readTeam(),
          readForecast(towns[0]).catch(() => null),
          readWarnings().catch(() => null)
        ]);
        const result = calculate(towns[0], team.get("Clonmel"), forecast, warningFeed);
        output.textContent = [
          ...result.working,
          `Draft level: ${levels[result.level] ?? "Undetermined"}`
        ].join("\n");
      } catch (error) {
        output.textContent = `Couldn’t calculate Clonmel’s level. ${error.message}`;
      }
    });

    document.querySelector("#plan-button").addEventListener("click", async event => {
      const button = event.currentTarget;
      const status = document.querySelector("#plan-status");
      const table = document.querySelector("#plan-table");
      const body = table.tBodies[0];

      button.disabled = true;
      table.hidden = true;
      body.replaceChildren();
      status.textContent = "Reading the Team Sheet and forecasts for eight towns…";

      try {
        const [team, forecasts, warningFeed] = await Promise.all([
          readTeam(),
          Promise.allSettled(towns.map(readForecast)),
          readWarnings().catch(() => null)
        ]);
        const results = towns.map((town, index) =>
          calculate(town, team.get(town[0]), forecasts[index].value, warningFeed)
        );
        const { assignments, jobs, mallowRestricted } = assignCrews(results, team);

        for (const result of results) {
          const row = body.insertRow();
          for (const value of [
            result.name,
            levels[result.level] ?? "Undetermined",
            result.working.join("\n"),
            proposedAction(result, assignments)
          ]) {
            row.insertCell().textContent = value;
          }
        }

        const crews = Object.entries(jobs)
          .map(([crew, assigned]) => `${crew}: ${assigned.join(", ") || "none"}`);
        status.textContent = [
          "Draft plan. Forecast river matches still need checking.",
          warningFeed ? "Met Éireann warnings checked." : "Met Éireann warning feed unavailable.",
          `Proposed crew assignments: ${crews.join(" | ")}.`,
          mallowRestricted ? "Mallow crew is limited to Mallow." : ""
        ].filter(Boolean).join(" ");
        table.hidden = false;
      } catch (error) {
        status.textContent = `Couldn’t build the draft plan. ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
